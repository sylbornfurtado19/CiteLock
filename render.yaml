services:
  - type: web
    name: citelock-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: STORAGE_PROVIDER
        value: firebase
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_API_KEY
        sync: false
      - key: MAX_CORRECTION_RETRIES
        value: "3"
      - key: PIPELINE_TIMEOUT_SECONDS
        value: "300"
      - key: MAX_VERIFICATION_WORKERS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
