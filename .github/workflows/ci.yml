name: CI

# Runs on every push to main and on every pull request, so a broken change is caught before Render and Vercel
# deploy it. Both jobs must pass.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile (python:3.11-slim) so CI tests what Render runs.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # Mock providers and in-memory SQLite: no secrets or network services are needed.
        run: pytest -q -W ignore
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock

      - name: Migrations generate valid SQL for the whole chain
        run: alembic upgrade head --sql > /dev/null
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        # Deployed builds refuse to build without a backend URL, so CI uses a placeholder to prove the build works.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://citelock-backend.example.com
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:0:web:ci
